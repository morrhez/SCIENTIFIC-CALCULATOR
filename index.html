<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENTIFIC CALCULATOR BY FARAZ</title>
        <link rel="stylesheet" href="style.css">

</head>
<body>
    <h3>SCIENTIFIC CALCULATOR MRZ-21</h3>
    <div class="calculator">
        <input type = "text"  id = "display" placeholder = "0">
        <div>
            <button type="button" class="operator">sin</button>
            <button type="button" class="operator">cos</button>
            <button type="button" class="operator">tan</button>
            <button type="button" class="operator">√</button>
        </div>
        <div>
            <button type="button" class="operator">log</button>
            <button type="button" class="operator">ln</button>
            <button type="button" class="operator">^</button>
            <button type="button" class="operator">(</button>
        </div>
        <div>
            <button type="button" class="operator">AC</button>
            <button type="button" class="operator">DEL</button>
            <button type="button" class="operator">%</button>
            <button type="button" class="operator">)</button>
        </div>
        <div>
            <button type="button" class="operator">7</button>
            <button type="button" class="operator">8</button>
            <button type="button" class="operator">9</button>
            <button type="button" class="operator">/</button>
        </div>
        <div>
            <button type="button" class="operator">4</button>
            <button type="button" class="operator">5</button>
            <button type="button" class="operator">6</button>
            <button type="button" class="operator">*</button>
        </div>
        <div>
            <button type="button" class="operator">1</button>
            <button type="button" class="operator">2</button>
            <button type="button" class="operator">3</button>
            <button type="button" class="operator">-</button>
        </div>
        <div>
            <button type="button" class="operator">π</button>
            <button type="button" class="operator">e</button>
            <button type="button" class="operator">0</button>
            <button type="button" class="operator">+</button>
        </div>
        <div>
            <button type="button" class="operator">00</button>
            <button type="button" class="operator">.</button>
            <button type="button" class="equalBTN">=</button>
        </div>
    </div> 

    <script src="script.js"></script>
</body>
</html>
