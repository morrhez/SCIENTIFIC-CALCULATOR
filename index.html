<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENTIFIC CALCULATOR BY FARAZ</title>
</head>
<body>
    <h3>SCIENTIFIC CALCULATOR MRZ-21</h3>
    <div class="calculator">
        <input type = "text " placeholder = "0">
        <div>
            <button>sin</button>
            <button>cos</button>
            <button>tan</button>
            <button>√</button>
        </div>
        <div>
            <button>log</button>
            <button>ln</button>
            <button>^</button>
            <button>(</button>
        </div>
        <div>
            <button>AC</button>
            <button>DEL</button>
            <button>%</button>
            <button>)</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
        </div>
        <div>
            <button>π</button>
            <button>e</button>
            <button>0</button>
            <button>+</button>
        </div>
        <div>
            <button>00</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div> 
</body>
</html>
